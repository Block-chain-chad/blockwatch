# Re-pin the xStocks share-per-token ratios, weekly.
#
# WHY THIS RUNS ON A CLOCK
#
# src/data/verifiedMints.json records each mint's ratio as the chain had it
# when scripts/verify-mints.mjs last ran. The issuer moves those ratios on its
# own schedule — sometimes within the hour — so the file goes stale by sitting
# still. `npm run check:pin` fails once it is more than MAX_PIN_AGE_DAYS old,
# and nothing was scheduled to stop that happening. This is that schedule.
#
# It opens a pull request rather than pushing: the file decides how a sell is
# sized, so a human looks at the diff. The reconciliation output goes in the
# body so the reviewer can see whether any feed disagrees with the chain
# before merging.
#
# SECRETS: none. api.mainnet-beta.solana.com, CoinGecko and Jupiter are all
# public and keyless here, and GITHUB_TOKEN is issued by Actions itself.
#
# RATE LIMITS: api.mainnet-beta.solana.com is a shared public endpoint and
# throttles aggressively. verify-mints batches all 103 mints into two
# getMultipleAccounts calls, which is well inside what it tolerates, but a
# throttled run exits non-zero and leaves the pinned file untouched by design
# — a failed run is a failed run, never an empty list. If throttling becomes
# routine, set SOLANA_RPC_URL to a dedicated endpoint; the script already
# reads it.

name: Re-pin xStocks ratios

on:
  schedule:
    # Mondays at 06:00 UTC, comfortably after the issuer's usual 00:30 UTC
    # activation window so a change made overnight is picked up the same week.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repin-mints
  cancel-in-progress: false

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Today's date, for the pull request title
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the ratios off Solana mainnet
        run: node scripts/verify-mints.mjs

      - name: Reconcile the price feeds against the chain
        # Informational: a flag here means a feed's unit looks wrong for an
        # asset, which is worth a human reading but is not a reason to abandon
        # a good re-pin. The output lands in the pull request body.
        id: reconcile
        continue-on-error: true
        run: |
          node scripts/check-multiplier-units.mjs 2>&1 | tee reconcile.txt

      - name: Confirm the tests still pass against the new pins
        run: npm test

      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: src/data/verifiedMints.json
          branch: chore/repin-xstocks-ratios
          delete-branch: true
          title: "Re-pin xStocks ratios ${{ steps.today.outputs.date }}"
          commit-message: |
            Re-pin xStocks share-per-token ratios

            Generated by .github/workflows/repin-mints.yml from Solana mainnet.
          body-path: reconcile.txt
          labels: |
            automated
            ratios
