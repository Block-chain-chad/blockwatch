# Build a SIGNED iOS app on a cloud Mac and upload it to TestFlight.
#
# Stage 2. Stage 1 (ios-build.yml) compiles unsigned and needs no Apple
# account; this one needs the paid Apple Developer Program. Both are
# manual-only — macOS runner minutes bill at 10x on private repos, so nothing
# here fires on push.
#
# SIGNING USES APPLE'S AUTOMATIC MANAGEMENT, on purpose. Creating a
# distribution certificate by hand means generating a certificate signing
# request, which is a macOS Keychain job — awkward from Windows and easy to get
# wrong. Given an App Store Connect API key, `-allowProvisioningUpdates` lets
# the runner create and download the certificate and provisioning profile
# itself, every run, and throw them away afterwards. Nothing to export, no
# .p12, no password, nothing to expire in a drawer.
#
# ── SETUP, ONCE: three secrets and one app record ────────────────────────────
#
# 1. Register the app — App Store Connect -> Apps -> "+" -> New App
#      Platform     iOS
#      Bundle ID    app.blockwatch     (must match capacitor.config.json)
#      Name         BlockWatch
#      SKU          blockwatch         (any private string; never shown)
#    If the bundle ID isn't in the dropdown, create it first at
#    developer.apple.com -> Certificates, Identifiers & Profiles ->
#    Identifiers -> "+" -> App IDs -> App -> explicit ID `app.blockwatch`.
#
# 2. Create an API key — App Store Connect -> Users and Access ->
#    Integrations -> App Store Connect API -> Team Keys -> "+"
#      Name    BlockWatch CI
#      Access  Admin        <-- MUST be Admin, not App Manager.
#
#    App Manager can upload builds but cannot create signing certificates, and
#    cloud signing does exactly that. With App Manager the export step fails
#    with "Cloud signing permission error" / "No signing certificate iOS
#    Distribution found" — after the archive has already succeeded, so it looks
#    like a signing bug rather than a permissions one. A key's role cannot be
#    changed after creation; a wrong one has to be replaced.
#
#    You get exactly ONE download of the .p8 file. Keep the Key ID and the
#    Issuer ID from that page (the Issuer ID is per-team, so it never changes).
#
# 3. Add three repository secrets — Settings -> Secrets and variables ->
#    Actions. All three are plain text; no base64, no binary files.
#      APPSTORE_KEY_ID       short code, e.g. 2X9R4HXF34
#      APPSTORE_ISSUER_ID    long dashed code at the top of the API keys page
#      APPSTORE_PRIVATE_KEY  the whole contents of AuthKey_XXXX.p8, including
#                            the BEGIN/END lines
#      APPLE_TEAM_ID         10 characters, from developer.apple.com ->
#                            Account -> Membership details
#
#    Plus the three already set for stage 1: VITE_SUPABASE_URL,
#    VITE_SUPABASE_ANON_KEY, VITE_POSTHOG_KEY.
#
# ── BEFORE THE FIRST RUN ─────────────────────────────────────────────────────
#
# Confirm the native data path is alive in production, or the app installs and
# shows no prices:
#
#   curl -sD - -o /dev/null \
#     "https://blockwatch.app/api/finnhub?kind=quote&symbol=AAPL&c=app" \
#     | grep -i "access-control"
#
# It must print: Access-Control-Allow-Origin: capacitor://localhost

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number — must be higher than the last upload'
        required: true
        default: '1'

jobs:
  testflight:
    # macos-26 for the SDK, not for the hardware. Apple rejects uploads built
    # against an old SDK — "all iOS apps must be built with the iOS 26 SDK or
    # later" — and it fails at UPLOAD, after a perfectly good signed .ipa
    # exists, so the message is easy to mistake for a signing problem.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pick the newest Xcode present rather than pinning a version, so this
      # survives the runner image being updated under us.
      - name: Select the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The money path and the number contract are pure functions. A broken
      # build must never reach a tester's phone.
      - name: Run tests
        run: npm test

      - name: Build web app (ios mode) and sync
        run: npm run build:ios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      # altool and xcodebuild both look for the key on disk by filename
      # convention. Written outside the workspace so it can't be committed,
      # and removed in the always() step at the end.
      - name: Stage the App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

      - name: Set build number and team
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ inputs.build_number }}" \
            ios/App/App/Info.plist
          echo "Build ${{ inputs.build_number }}, team $TEAM_ID"

      # Archive UNSIGNED, then sign at export. Three runs established why:
      #   1. Capacitor ships a development identity in Release, so Xcode asked
      #      Apple for a Development profile -> "your team has no devices from
      #      which to generate a provisioning profile".
      #   2. Naming a distribution identity instead -> "conflicting provisioning
      #      settings", because under CODE_SIGN_STYLE=Automatic any named
      #      identity counts as a manual one.
      #   3. Naming nothing at all -> automatic signing STILL asks for a
      #      Development profile at archive time. That is simply what it does,
      #      and Development profiles need a registered device a CI runner
      #      hasn't got.
      # Signing at export sidesteps the lot: -exportArchive with
      # app-store-connect and -allowProvisioningUpdates creates the
      # DISTRIBUTION certificate and App Store profile — neither of which needs
      # a device — and signs the payload on the way out.
      - name: Archive (unsigned — signing happens at export)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=app.blockwatch \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export .ipa
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # Kept for 5 days so a failed upload doesn't mean rebuilding.
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockWatch-ipa-${{ inputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 5
          if-no-files-found: ignore

      - name: Remove the signing key
        if: always()
        run: rm -rf ~/private_keys
