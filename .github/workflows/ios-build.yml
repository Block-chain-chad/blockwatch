# iOS build validation on a cloud Mac (GitHub Actions macOS runner).
#
# Stage 1 (this file): compile the app UNSIGNED to prove the Capacitor iOS
# project builds — no Apple Developer account needed. Run it manually from
# the GitHub Actions tab (workflow_dispatch); it does not run on push, since
# macOS runner minutes bill at 10x on private repos.
#
# Stage 2 (later, once the Apple Developer account exists): extend with
# signing certificates + provisioning profile secrets and an
# archive/export/upload-to-TestFlight step.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_POSTHOG_KEY, VITE_SENTRY_DSN
# These are the publishable client keys (same ones baked into the web
# bundle), not server secrets.

name: iOS build (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (ios mode) and sync
        run: npm run build:ios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Compile iOS app (unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
